# Nginx snippet for the same COOP/COEP requirement described in
# ../cloudflare-pages/_headers. Include this inside your `server {}` block
# (or the specific `location {}` block serving this app):
#
#   server {
#       ...
#       include /path/to/coop-coep.conf;
#       ...
#   }
#
# `always` makes nginx add these headers on error responses too, not just
# 2xx - matches how add_header is documented to behave.
# Docs: https://nginx.org/en/docs/http/ngx_http_headers_module.html

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
