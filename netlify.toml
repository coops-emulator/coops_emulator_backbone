# Netlify config for the same COOP/COEP requirement as the Cloudflare Pages
# _headers file in this deploy/ folder - see that file's comments for why.
# Docs: https://docs.netlify.com/routing/headers/
#
# Netlify also supports a plain `_headers` file with the same syntax as
# Cloudflare Pages' (see ../cloudflare-pages/_headers) if you'd rather not
# use a netlify.toml. Pick one, not both, to avoid maintaining two copies
# of the same rule.

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
